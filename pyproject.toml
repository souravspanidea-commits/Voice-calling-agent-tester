[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inbound-tester"
version = "0.1.0"
description = "Inbound test agent for validating outbound ElevenLabs voice agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "streamlit>=1.30.0",
]

[project.scripts]
inbound-tester = "inbound_tester.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
